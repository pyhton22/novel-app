name: Build Android APK (墨匠小说工坊)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 配置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装 Capacitor 打包依赖
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: 初始化 Android 原生工程
        run: |
          npx cap init "墨匠工坊" "com.inkmaster.novel" --web-dir "."
          npx cap add android

      - name: 配置 Android 图标与静态资源
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp icon.png android/app/src/main/res/drawable/icon.png || true
          npx cap sync android

      - name: 编译生成 Android APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 上传 APK 安装包至 GitHub 产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: 墨匠小说工坊-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
