name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets
        run: |
          mkdir -p dist
          cp index.html app.js icon.png manifest.json dist/ || true

      - name: Install Capacitor 6 (Ultra Stable)
        run: |
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Init Native Project
        run: |
          npx cap init "墨匠工坊" "com.inkmaster.novel" --web-dir "dist"
          npx cap add android

      - name: Sync Android Assets
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp icon.png android/app/src/main/res/drawable/icon.png || true
          npx cap sync android

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 墨匠小说工坊-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
